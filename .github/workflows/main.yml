
name: ALONE CLOUD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: alone-cloud-runner
  cancel-in-progress: true

jobs:
  run-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Project
        run: |
          python -m compileall -q app telegram_bot.py
          test -f app/__init__.py
          test -f app/main.py
          test -f app/config.py
          test -f telegram_bot.py
          echo "Project validation successful"

      - name: Start ALONE CLOUD
        shell: bash
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}

        run: |
          set -Eeuo pipefail

          for name in DATABASE_URL AI_API_KEY TELEGRAM_BOT_TOKEN ADMIN_API_KEY CLOUD_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Secret: $name"
              exit 1
            fi
          done

          export AI_BASE_URL="${AI_BASE_URL:-https://api.openai.com/v1}"
          export AI_MODEL="${AI_MODEL:-gpt-4o-mini}"

          API_PID=""
          BOT_PID=""

          cleanup() {
            echo "Stopping ALONE CLOUD..."

            if [[ -n "$BOT_PID" ]]; then
              kill "$BOT_PID" 2>/dev/null || true
            fi

            if [[ -n "$API_PID" ]]; then
              kill "$API_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          echo "Checking Python imports..."

          python -c "from app.main import app; print('FastAPI import OK')"

          echo "Starting API..."

          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            --log-level info > uvicorn.log 2>&1 &

          API_PID=$!

          API_READY=false

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              API_READY=true
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::API process stopped"
              cat uvicorn.log
              exit 1
            fi

            sleep 2
          done

          if [[ "$API_READY" != "true" ]]; then
            echo "::error::API health check failed"
            cat uvicorn.log
            exit 1
          fi

          echo "ALONE CLOUD API READY"

          echo "Starting Telegram Bot..."

          python telegram_bot.py &
          BOT_PID=$!

          echo "ALONE CLOUD IS RUNNING"

          while true; do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::API stopped"
              cat uvicorn.log
              exit 1
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "::error::Telegram Bot stopped"
              exit 1
            fi

            sleep 10
          done
