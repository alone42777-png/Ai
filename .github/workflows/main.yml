
name: ALONE CLOUD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: alone-cloud-runner
  cancel-in-progress: true

jobs:
  run-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Files
        run: |
          python -m compileall -q .
          echo "Python validation successful"

      - name: Check Required Files
        run: |
          test -f main.py
          test -f telegram_bot.py
          test -f requirements.txt
          echo "All required files found"

      - name: Start ALONE CLOUD
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}

        run: |
          set -euo pipefail

          echo "Starting ALONE CLOUD..."

          for name in DATABASE_URL AI_API_KEY TELEGRAM_BOT_TOKEN ADMIN_API_KEY CLOUD_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Secret: $name"
              exit 1
            fi
          done

          export AI_BASE_URL="${AI_BASE_URL:-https://api.openai.com/v1}"
          export AI_MODEL="${AI_MODEL:-gpt-4o-mini}"

          API_PID=""
          BOT_PID=""

          cleanup() {
            echo "Stopping ALONE CLOUD..."

            if [[ -n "$BOT_PID" ]]; then
              kill "$BOT_PID" 2>/dev/null || true
            fi

            if [[ -n "$API_PID" ]]; then
              kill "$API_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          echo "Starting FastAPI..."

          python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 &
          
          API_PID=$!

          echo "Waiting for API..."

          API_READY=false

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              API_READY=true
              echo ""
              echo "ALONE CLOUD API READY"
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::API process stopped"
              exit 1
            fi

            sleep 2
          done

          if [[ "$API_READY" != "true" ]]; then
            echo "::error::API health check failed"
            exit 1
          fi

          echo "Starting Telegram Bot..."

          python telegram_bot.py &
          BOT_PID=$!

          echo "ALONE CLOUD IS RUNNING"

          wait "$BOT_PID"
